<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrOpen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#374151" stroke-width="1.4"/>
    </marker>
    <marker id="arrTri" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Padrão Adapter aplicado ao processamento de pagamento</text>

  <!-- Client -->
  <rect x="40" y="220" width="180" height="60" rx="6" fill="#2f6fb5"/>
  <text x="130" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">PedidoService</text>
  <text x="130" y="270" text-anchor="middle" font-size="9.5" fill="#dbe7f5">(Client)</text>

  <!-- Target interface -->
  <rect x="300" y="120" width="260" height="60" rx="6" fill="#ffffff" stroke="#3b5aa0" stroke-width="1.6"/>
  <text x="430" y="140" text-anchor="middle" font-size="10" font-style="italic" fill="#3b5aa0">«interface» (Target)</text>
  <text x="430" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">IGatewayPagamentoAdapter</text>
  <text x="430" y="172" text-anchor="middle" font-size="9.5" fill="#4b5563">+ ProcessarPagamento(pedido)</text>

  <!-- Adapter -->
  <rect x="300" y="240" width="260" height="70" rx="6" fill="#6b7280"/>
  <text x="430" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">GatewayPagamentoAdapter</text>
  <text x="430" y="277" text-anchor="middle" font-size="9.5" fill="#e5e7eb">(Adapter)</text>
  <text x="430" y="292" text-anchor="middle" font-size="9.5" fill="#e5e7eb">traduz para o formato do SDK externo</text>

  <!-- Adaptee -->
  <rect x="640" y="240" width="220" height="70" rx="6" fill="#94a3b8"/>
  <text x="750" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SDK do Gateway</text>
  <text x="750" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">de Pagamento externo</text>
  <text x="750" y="296" text-anchor="middle" font-size="9.5" fill="#f1f5f9">(Adaptee, interface própria)</text>

  <!-- arrows -->
  <line x1="220" y1="250" x2="298" y2="250" stroke="#374151" stroke-width="1.6" marker-end="url(#arrOpen)"/>
  <text x="230" y="242" font-size="9.5" fill="#374151">depende de (DIP)</text>

  <line x1="430" y1="240" x2="430" y2="182" stroke="#374151" stroke-width="1.4" marker-end="url(#arrTri)"/>
  <text x="440" y="215" font-size="9.5" fill="#374151">implementa</text>

  <line x1="560" y1="275" x2="638" y2="275" stroke="#374151" stroke-width="1.6" marker-end="url(#arrOpen)"/>
  <text x="565" y="267" font-size="9.5" fill="#374151">chama</text>

  <!-- explicação -->
  <rect x="40" y="360" width="820" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="384" font-size="11" fill="#334155">Problema: o SDK do gateway de pagamento expõe sua própria interface (Adaptee), diferente da que o</text>
  <text x="60" y="402" font-size="11" fill="#334155">PedidoService espera usar. Não é possível nem desejável alterar o SDK de terceiros para se adequar ao sistema.</text>
  <text x="60" y="426" font-size="11" fill="#334155">Solução: GatewayPagamentoAdapter implementa a interface IGatewayPagamentoAdapter (Target) esperada pelo</text>
  <text x="60" y="444" font-size="11" fill="#334155">PedidoService, e internamente traduz cada chamada para o formato exigido pelo SDK externo (Adaptee).</text>
  <text x="60" y="468" font-size="11" fill="#334155">Benefício: trocar de gateway (ex.: Stripe → PagSeguro) significa criar um novo Adapter, sem alterar PedidoService.</text>
</svg>
