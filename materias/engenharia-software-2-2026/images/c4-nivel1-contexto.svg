<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Sistema Unespão — Diagrama de Contexto (C4 Nível 1)</text>

  <!-- Atores -->
  <g>
    <rect x="60" y="60" width="230" height="90" rx="8" fill="#1b3a5c"/>
    <text x="175" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Cliente</text>
    <text x="175" y="104" text-anchor="middle" font-size="10.5" fill="#d1d9e6">[Pessoa]</text>
    <text x="175" y="122" text-anchor="middle" font-size="10.5" fill="#ffffff">Monta, personaliza e</text>
    <text x="175" y="136" text-anchor="middle" font-size="10.5" fill="#ffffff">finaliza pedidos</text>
  </g>

  <g>
    <rect x="700" y="60" width="240" height="90" rx="8" fill="#1b3a5c"/>
    <text x="820" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Atendente / Administrador</text>
    <text x="820" y="98" text-anchor="middle" font-size="10.5" fill="#d1d9e6">[Pessoa]</text>
    <text x="820" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">Gerencia catálogo</text>
    <text x="820" y="130" text-anchor="middle" font-size="10.5" fill="#ffffff">(produtos, ingredientes) e estoque</text>
  </g>

  <!-- Sistema principal -->
  <rect x="330" y="250" width="340" height="110" rx="8" fill="#2f6fb5"/>
  <text x="500" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Sistema Unespão</text>
  <text x="500" y="303" text-anchor="middle" font-size="10.5" fill="#dbe7f5">[Sistema de Software]</text>
  <text x="500" y="323" text-anchor="middle" font-size="10.5" fill="#ffffff">Gerencia pedidos, catálogo,</text>
  <text x="500" y="337" text-anchor="middle" font-size="10.5" fill="#ffffff">estoque e sugestões personalizadas</text>

  <!-- Sistemas externos -->
  <g>
    <rect x="40" y="470" width="240" height="90" rx="8" fill="#6b7280"/>
    <text x="160" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Serviço de Autenticação</text>
    <text x="160" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">(Google)</text>
    <text x="160" y="525" text-anchor="middle" font-size="10.5" fill="#e5e7eb">[Sistema Externo]</text>
    <text x="160" y="543" text-anchor="middle" font-size="10.5" fill="#ffffff">Login via OAuth 2.0</text>
  </g>

  <g>
    <rect x="380" y="470" width="240" height="90" rx="8" fill="#6b7280"/>
    <text x="500" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">API de Localização/CEP</text>
    <text x="500" y="510" text-anchor="middle" font-size="10.5" fill="#e5e7eb">[Sistema Externo]</text>
    <text x="500" y="528" text-anchor="middle" font-size="10.5" fill="#ffffff">Reservada para expansão</text>
    <text x="500" y="542" text-anchor="middle" font-size="10.5" fill="#ffffff">futura (múltiplas unidades)</text>
  </g>

  <g>
    <rect x="720" y="470" width="240" height="90" rx="8" fill="#6b7280"/>
    <text x="840" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Gateway de Pagamento</text>
    <text x="840" y="510" text-anchor="middle" font-size="10.5" fill="#e5e7eb">[Sistema Externo]</text>
    <text x="840" y="528" text-anchor="middle" font-size="10.5" fill="#ffffff">Processa as transações</text>
    <text x="840" y="542" text-anchor="middle" font-size="10.5" fill="#ffffff">financeiras dos pedidos</text>
  </g>

  <!-- Setas -->
  <line x1="220" y1="150" x2="420" y2="248" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="255" y="200" font-size="10" fill="#374151">Monta lanche, faz pedido</text>
  <text x="255" y="213" font-size="10" fill="#374151">e paga [HTTPS]</text>

  <line x1="790" y1="150" x2="580" y2="248" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="700" y="200" font-size="10" fill="#374151">Gerencia catálogo</text>
  <text x="700" y="213" font-size="10" fill="#374151">e estoque [HTTPS]</text>

  <line x1="420" y1="360" x2="200" y2="468" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="430" font-size="10" fill="#374151">Autentica identidade</text>
  <text x="200" y="443" font-size="10" fill="#374151">[OAuth 2.0/HTTPS]</text>

  <line x1="500" y1="360" x2="500" y2="468" stroke="#374151" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="510" y="420" font-size="10" fill="#374151">Consulta endereço/</text>
  <text x="510" y="433" font-size="10" fill="#374151">unidade [REST/JSON]</text>
  <text x="510" y="446" font-size="10" font-style="italic" fill="#6b7280">(não usado nesta versão)</text>

  <line x1="580" y1="360" x2="800" y2="468" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="655" y="430" font-size="10" fill="#374151">Processa pagamento</text>
  <text x="655" y="443" font-size="10" fill="#374151">[REST/HTTPS]</text>

  <!-- Legenda -->
  <g transform="translate(40,586)">
    <rect x="0" y="0" width="14" height="14" fill="#1b3a5c"/>
    <text x="20" y="12" font-size="10.5" fill="#374151">Pessoa / Ator</text>
    <rect x="140" y="0" width="14" height="14" fill="#2f6fb5"/>
    <text x="160" y="12" font-size="10.5" fill="#374151">Sistema principal</text>
    <rect x="300" y="0" width="14" height="14" fill="#6b7280"/>
    <text x="320" y="12" font-size="10.5" fill="#374151">Sistema externo</text>
    <line x1="460" y1="7" x2="500" y2="7" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="508" y="12" font-size="10.5" fill="#374151">Fluxo ativo</text>
    <line x1="620" y1="7" x2="660" y2="7" stroke="#374151" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="668" y="12" font-size="10.5" fill="#374151">Integração prevista, não implementada</text>
  </g>
</svg>
