<svg viewBox="0 0 900 1220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af1" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#374151" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1220" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Diagrama de Atividade — Fluxo Principal do Cliente</text>

  <!-- Inicio -->
  <ellipse cx="450" cy="60" rx="90" ry="24" fill="#1b3a5c"/>
  <text x="450" y="65" text-anchor="middle" font-size="11" fill="#ffffff">Início do pedido</text>
  <line x1="450" y1="84" x2="450" y2="112" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>

  <!-- Decisao canal -->
  <polygon points="450,110 520,150 450,190 380,150" fill="#fef9e7" stroke="#eab308" stroke-width="1.4"/>
  <text x="450" y="154" text-anchor="middle" font-size="10.5" fill="#78350f">Canal?</text>

  <!-- App branch -->
  <line x1="400" y1="165" x2="220" y2="220" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <text x="270" y="200" font-size="9.5" fill="#374151">Aplicativo</text>
  <rect x="110" y="222" width="230" height="48" rx="6" fill="#2f6fb5"/>
  <text x="225" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1. Autenticação normal no app</text>
  <text x="225" y="257" text-anchor="middle" font-size="9" fill="#dbe7f5">histórico já associado à conta</text>

  <!-- Totem branch: decision -->
  <line x1="500" y1="165" x2="650" y2="215" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <text x="600" y="195" font-size="9.5" fill="#374151">Totem físico</text>
  <polygon points="650,215 730,250 650,285 570,250" fill="#fef9e7" stroke="#eab308" stroke-width="1.4"/>
  <text x="650" y="245" text-anchor="middle" font-size="9" fill="#78350f">Identificação</text>
  <text x="650" y="258" text-anchor="middle" font-size="9" fill="#78350f">no totem?</text>

  <line x1="580" y1="262" x2="480" y2="300" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <text x="500" y="285" font-size="9" fill="#374151">QR code</text>
  <rect x="360" y="302" width="230" height="48" rx="6" fill="#2f6fb5"/>
  <text x="475" y="322" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">1a. Escaneia QR code</text>
  <text x="475" y="337" text-anchor="middle" font-size="8.5" fill="#dbe7f5">sessão do app vinculada ao totem</text>

  <line x1="720" y1="262" x2="750" y2="300" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <text x="700" y="285" font-size="9" fill="#374151">sem login</text>
  <rect x="650" y="302" width="220" height="48" rx="6" fill="#6b7280"/>
  <text x="760" y="322" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">1b. Pedido anônimo</text>
  <text x="760" y="337" text-anchor="middle" font-size="8.5" fill="#f1f5f9">sem identificação no totem</text>

  <!-- converge to step 2 -->
  <line x1="225" y1="270" x2="400" y2="400" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <line x1="475" y1="350" x2="440" y2="400" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <line x1="760" y1="350" x2="480" y2="400" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>

  <rect x="300" y="402" width="300" height="46" rx="6" fill="#2f6fb5"/>
  <text x="450" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2. Escolha do produto base</text>

  <line x1="450" y1="448" x2="450" y2="476" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <rect x="270" y="478" width="360" height="52" rx="6" fill="#2f6fb5"/>
  <text x="450" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3. Adição de ingredientes</text>
  <text x="450" y="516" text-anchor="middle" font-size="9.5" fill="#dbe7f5">com atualização incremental do preço</text>

  <line x1="450" y1="530" x2="450" y2="558" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <rect x="270" y="560" width="360" height="52" rx="6" fill="#2f6fb5"/>
  <text x="450" y="582" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4. Revisão do pedido</text>
  <text x="450" y="598" text-anchor="middle" font-size="9.5" fill="#dbe7f5">editar ou cancelar item</text>

  <!-- loop back ajustar -->
  <path d="M270,586 C 190,586 190,504 268,504" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#af1)"/>
  <text x="150" y="548" text-anchor="middle" font-size="9.5" fill="#374151">ajustar</text>

  <line x1="450" y1="612" x2="450" y2="640" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <text x="465" y="632" font-size="9" fill="#374151">confirmar</text>
  <rect x="300" y="642" width="300" height="46" rx="6" fill="#2f6fb5"/>
  <text x="450" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5. Pagamento via Gateway</text>

  <line x1="450" y1="688" x2="450" y2="716" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <rect x="300" y="718" width="300" height="46" rx="6" fill="#2f6fb5"/>
  <text x="450" y="746" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">6. Confirmação do pedido</text>

  <line x1="450" y1="764" x2="450" y2="792" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <rect x="270" y="794" width="360" height="52" rx="6" fill="#3b5aa0"/>
  <text x="450" y="816" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">7. Avaliação do prato</text>
  <text x="450" y="832" text-anchor="middle" font-size="9.5" fill="#dbe7f5">momento posterior, após retirada</text>

  <!-- dashed from anonimo to avaliacao -->
  <path d="M780,350 C 900,600 900,800 632,818" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#af1)"/>
  <text x="810" y="600" text-anchor="middle" font-size="9" fill="#6b7280" transform="rotate(90 810 600)">vínculo posterior à conta</text>

  <line x1="450" y1="846" x2="450" y2="874" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <rect x="250" y="876" width="400" height="52" rx="6" fill="#3b5aa0"/>
  <text x="450" y="898" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">8. Sugestões personalizadas</text>
  <text x="450" y="914" text-anchor="middle" font-size="9.5" fill="#dbe7f5">em pedidos futuros, via Histórico e Avaliações</text>

  <line x1="450" y1="928" x2="450" y2="956" stroke="#374151" stroke-width="1.4" marker-end="url(#af1)"/>
  <ellipse cx="450" cy="980" rx="90" ry="24" fill="#1b3a5c"/>
  <text x="450" y="985" text-anchor="middle" font-size="11" fill="#ffffff">Fim do ciclo</text>

  <!-- Legenda -->
  <rect x="60" y="1040" width="780" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="1064" font-size="10.5" fill="#334155">O fluxo é idêntico nos dois canais a partir do passo 2; a única diferença está na etapa 1, onde o totem</text>
  <text x="80" y="1082" font-size="10.5" fill="#334155">bifurca entre a rota de QR code (sessão do app vinculada ao totem) e a rota de pedido anônimo. A seta</text>
  <text x="80" y="1100" font-size="10.5" fill="#334155">tracejada de "Pedido anônimo" até "Avaliação do prato" indica que o vínculo com a conta, quando feito,</text>
  <text x="80" y="1118" font-size="10.5" fill="#334155">pode ocorrer depois da compra — o histórico e as avaliações do pedido anônimo passam a contar</text>
  <text x="80" y="1136" font-size="10.5" fill="#334155">retroativamente para o cliente a partir desse vínculo. O laço "ajustar" entre os passos 3 e 4 permite</text>
  <text x="80" y="1154" font-size="10.5" fill="#334155">ao cliente voltar e alterar ingredientes quantas vezes quiser antes de confirmar o pagamento.</text>
</svg>
