<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Pirâmide de testes aplicada ao Sistema Unespão</text>

  <!-- Pyramid layers (trapezoids) -->
  <polygon points="360,60 460,60 500,150 320,150" fill="#94a3b8" stroke="#64748b"/>
  <text x="410" y="95" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Sistema</text>
  <text x="410" y="112" text-anchor="middle" font-size="9.5" fill="#f1f5f9">(interface completa)</text>
  <text x="410" y="128" text-anchor="middle" font-size="9.5" font-style="italic" fill="#f1f5f9">não aplicável nesta</text>
  <text x="410" y="142" text-anchor="middle" font-size="9.5" font-style="italic" fill="#f1f5f9">fase (sem protótipo)</text>

  <polygon points="320,150 500,150 560,270 260,270" fill="#3b5aa0" stroke="#334155"/>
  <text x="410" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Testes de Integração</text>
  <text x="410" y="220" text-anchor="middle" font-size="10" fill="#dbe7f5">API Unespão + PostgreSQL</text>
  <text x="410" y="236" text-anchor="middle" font-size="10" fill="#dbe7f5">(via EF Core / Npgsql)</text>
  <text x="410" y="252" text-anchor="middle" font-size="10" fill="#dbe7f5">menos numerosos, mais lentos</text>

  <polygon points="260,270 560,270 640,430 180,430" fill="#2f6fb5" stroke="#1e3a5f"/>
  <text x="410" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Testes de Unidade</text>
  <text x="410" y="355" text-anchor="middle" font-size="10.5" fill="#dbe7f5">PedidoService, EstoqueService,</text>
  <text x="410" y="373" text-anchor="middle" font-size="10.5" fill="#dbe7f5">cálculo de preço do ItemPersonalizado</text>
  <text x="410" y="391" text-anchor="middle" font-size="10.5" fill="#dbe7f5">(dependências mockadas com Moq)</text>
  <text x="410" y="412" text-anchor="middle" font-size="10.5" fill="#dbe7f5">muitos, rápidos, base da suíte</text>

  <!-- axis labels -->
  <text x="700" y="105" font-size="10" fill="#64748b">poucos</text>
  <text x="700" y="415" font-size="10" fill="#64748b">muitos</text>
  <line x1="680" y1="70" x2="680" y2="420" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrPyr)"/>
  <defs>
    <marker id="arrPyr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <text x="700" y="250" font-size="10" fill="#64748b" transform="rotate(90 700 250)">quantidade de casos de teste</text>

  <rect x="40" y="450" width="740" height="25" rx="4" fill="#fef9e7" stroke="#eab308"/>
  <text x="410" y="467" text-anchor="middle" font-size="9.5" fill="#78350f">Modelo conceitual da literatura de testes (não é conteúdo específico dos slides da disciplina), aplicado aqui ao caso do Sistema Unespão.</text>
</svg>
