<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrOpenDec" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#374151" stroke-width="1.4"/>
    </marker>
    <marker id="arrTriDec" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Padrão Decorator aplicado à personalização de lanche no Sistema Unespão</text>

  <!-- Component (Interface) -->
  <rect x="330" y="55" width="240" height="70" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="75" text-anchor="middle" font-size="10" font-style="italic" fill="#2563eb">«interface» (Component)</text>
  <text x="450" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">IItemPersonalizavel</text>
  <text x="450" y="108" text-anchor="middle" font-size="9.5" fill="#475569">+ GetDescricao() : string</text>
  <text x="450" y="120" text-anchor="middle" font-size="9.5" fill="#475569">+ GetPreco() : decimal</text>

  <!-- ConcreteComponent -->
  <rect x="100" y="190" width="220" height="75" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="210" text-anchor="middle" font-size="10" fill="#64748b">(ConcreteComponent)</text>
  <text x="210" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">ProdutoBase</text>
  <text x="210" y="244" text-anchor="middle" font-size="9" fill="#475569">Ex: Pão Francês (R$ 8,00)</text>
  <text x="210" y="258" text-anchor="middle" font-size="9" fill="#475569">Inicia a cadeia de personalização</text>

  <!-- Decorator (Abstract) -->
  <rect x="580" y="185" width="240" height="85" rx="6" fill="#f1f5f9" stroke="#0284c7" stroke-width="1.5"/>
  <text x="700" y="205" text-anchor="middle" font-size="10" font-style="italic" fill="#0284c7">«abstract» (Decorator)</text>
  <text x="700" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">IngredienteDecorator</text>
  <text x="700" y="240" text-anchor="middle" font-size="9" fill="#475569"># itemDecorado : IItemPersonalizavel</text>
  <text x="700" y="255" text-anchor="middle" font-size="9" fill="#475569">+ GetDescricao() / GetPreco()</text>

  <!-- Concrete Decorators -->
  <rect x="470" y="325" width="180" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="560" y="343" text-anchor="middle" font-size="9.5" fill="#92400e">(ConcreteDecorator)</text>
  <text x="560" y="360" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#78350f">QueijoDecorator</text>
  <text x="560" y="375" text-anchor="middle" font-size="9" fill="#92400e">+ R$ 4,50 ao GetPreco()</text>

  <rect x="680" y="325" width="180" height="65" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="770" y="343" text-anchor="middle" font-size="9.5" fill="#991b1b">(ConcreteDecorator)</text>
  <text x="770" y="360" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">BaconDecorator</text>
  <text x="770" y="375" text-anchor="middle" font-size="9" fill="#991b1b">+ R$ 4,50 ao GetPreco()</text>

  <!-- Arrows -->
  <!-- ProdutoBase -> IItemPersonalizavel -->
  <line x1="210" y1="190" x2="210" y2="150" stroke="#374151" stroke-width="1.3"/>
  <line x1="210" y1="150" x2="390" y2="150" stroke="#374151" stroke-width="1.3"/>
  <line x1="390" y1="150" x2="390" y2="127" stroke="#374151" stroke-width="1.3" marker-end="url(#arrTriDec)"/>

  <!-- IngredienteDecorator -> IItemPersonalizavel (Inheritance) -->
  <line x1="700" y1="185" x2="700" y2="150" stroke="#374151" stroke-width="1.3"/>
  <line x1="700" y1="150" x2="510" y2="150" stroke="#374151" stroke-width="1.3"/>
  <line x1="510" y1="150" x2="510" y2="127" stroke="#374151" stroke-width="1.3" marker-end="url(#arrTriDec)"/>

  <!-- IngredienteDecorator -> IItemPersonalizavel (Aggregation/Reference) -->
  <path d="M 820 220 Q 860 220 860 90 Q 860 90 572 90" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrOpenDec)"/>
  <text x="830" y="160" font-size="9" fill="#0284c7" transform="rotate(90, 830, 160)">contém (1..*)</text>

  <!-- Concrete Decorators -> IngredienteDecorator -->
  <line x1="560" y1="325" x2="560" y2="295" stroke="#374151" stroke-width="1.2"/>
  <line x1="560" y1="295" x2="670" y2="295" stroke="#374151" stroke-width="1.2"/>
  <line x1="670" y1="295" x2="670" y2="272" stroke="#374151" stroke-width="1.2" marker-end="url(#arrTriDec)"/>

  <line x1="770" y1="325" x2="770" y2="295" stroke="#374151" stroke-width="1.2"/>
  <line x1="770" y1="295" x2="730" y2="295" stroke="#374151" stroke-width="1.2"/>
  <line x1="730" y1="295" x2="730" y2="272" stroke="#374151" stroke-width="1.2" marker-end="url(#arrTriDec)"/>

  <!-- Concrete runtime execution chain box -->
  <rect x="40" y="415" width="820" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="438" font-size="11" font-weight="bold" fill="#0f172a">Instanciação dinâmica em tempo de execução (Exemplo prático do totem):</text>
  <text x="60" y="458" font-size="10.5" fill="#334155">• IItemPersonalizavel item = new ProdutoBase("Pão Francês", 8.00m);</text>
  <text x="60" y="476" font-size="10.5" fill="#334155">• item = new QueijoDecorator(item, "Queijo Canastra", 4.50m);  // GetPreco() agora retorna R$ 12,50</text>
  <text x="60" y="494" font-size="10.5" fill="#334155">• item = new BaconDecorator(item, "Bacon na Chapa", 4.50m);    // GetPreco() final: R$ 17,00</text>
  <text x="60" y="516" font-size="10" font-weight="bold" fill="#0284c7">Benefício Arquitetural: Elimina a explosão combinatória de 2^N subclasses e realiza o recálculo dinâmico incremental de preço no SPA React.</text>
</svg>
