<svg viewBox="0 0 1600 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="630" fill="#eef0f2"/>

  <!-- Painel esquerdo -->
  <rect x="20" y="20" width="1000" height="590" rx="14" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/>
  <text x="52" y="66" font-size="13" font-weight="bold" letter-spacing="1" fill="#e2792a">PASSO 1</text>
  <text x="52" y="94" font-size="22" font-weight="bold" fill="#1f2430">Escolha a Base do Lanche</text>
  <text x="968" y="66" text-anchor="end" font-size="12" fill="#6b7280">1 obrigatório</text>
  <line x1="52" y1="112" x2="968" y2="112" stroke="#eef0f2" stroke-width="1"/>

  <!-- Card 1: selecionado -->
  <g>
    <rect x="52" y="128" width="440" height="152" rx="10" fill="#fdf6e3" stroke="#e2792a" stroke-width="2"/>
    <circle cx="80" cy="152" r="12" fill="#f2d9b0"/>
    <text x="80" y="157" text-anchor="middle" font-size="12">🍞</text>
    <text x="102" y="150" font-size="14.5" font-weight="bold" fill="#1f2430">Pão Francês Tradicional</text>
    <text x="480" y="150" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 4.50</text>
    <text x="102" y="170" font-size="11" fill="#6b7280">🔥 140 kcal   •   🕐 4 min</text>
    <text x="80" y="196" font-size="11" fill="#4b5563">
      <tspan x="80" dy="0">Casquinha super crocante e miolo macio</tspan>
      <tspan x="80" dy="15">fresquinho assado de hora em hora na</tspan>
      <tspan x="80" dy="15">padaria.</tspan>
    </text>
    <text x="480" y="266" text-anchor="end" font-size="12.5" font-weight="bold" fill="#e2792a">✓ Base Selecionada</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="512" y="128" width="440" height="152" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="540" y="140" width="24" height="24" rx="5" fill="#f1e4d3"/>
    <text x="102" y="150" font-size="14.5" font-weight="bold" fill="#1f2430"></text>
    <text x="576" y="150" font-size="14.5" font-weight="bold" fill="#1f2430">Pão Australiano com Mel</text>
    <text x="940" y="150" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 6.00</text>
    <text x="576" y="170" font-size="11" fill="#6b7280">🔥 180 kcal   •   🕐 4 min</text>
    <text x="540" y="206" font-size="11" fill="#4b5563">
      <tspan x="540" dy="0">Pão escuro macio, levemente adocicado com</tspan>
      <tspan x="540" dy="15">toque sutil de cacau e mel silvestre.</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="52" y="296" width="440" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="80" y="308" width="24" height="24" rx="12" fill="#f6d9c8"/>
    <text x="102" y="322" font-size="14.5" font-weight="bold" fill="#1f2430">Baguete de Fermentação Natural</text>
    <text x="480" y="322" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 7.50</text>
    <text x="102" y="342" font-size="11" fill="#6b7280">🔥 195 kcal   •   🕐 5 min</text>
    <text x="80" y="378" font-size="11" fill="#4b5563">
      <tspan x="80" dy="0">Fermentação longa de 24h, casca dourada e</tspan>
      <tspan x="80" dy="15">rústica, sabor levemente acidulado.</tspan>
    </text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="512" y="296" width="440" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="540" y="308" width="24" height="24" rx="5" fill="#e8dcc4"/>
    <text x="576" y="322" font-size="14.5" font-weight="bold" fill="#1f2430">Pão de Forma 12 Grãos</text>
    <text x="940" y="322" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 5.50</text>
    <text x="576" y="342" font-size="11" fill="#6b7280">🔥 130 kcal   •   🕐 3 min</text>
    <text x="540" y="378" font-size="11" fill="#4b5563">
      <tspan x="540" dy="0">Opção leve e nutritiva com aveia, linhaça, chia,</tspan>
      <tspan x="540" dy="15">girassol e gergelim tostado.</tspan>
    </text>
  </g>

  <!-- Card 5 -->
  <g>
    <rect x="52" y="452" width="440" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="92" cy="464" r="12" fill="#f3c9b6"/>
    <text x="102" y="478" font-size="14.5" font-weight="bold" fill="#1f2430">Ciabatta Rústica com Azeite</text>
    <text x="480" y="478" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 6.50</text>
    <text x="102" y="498" font-size="11" fill="#6b7280">🔥 170 kcal   •   🕐 4 min</text>
    <text x="80" y="534" font-size="11" fill="#4b5563">
      <tspan x="80" dy="0">Massa aerada e alveolada típica italiana,</tspan>
      <tspan x="80" dy="15">untada com azeite de oliva extravirgem.</tspan>
    </text>
  </g>

  <!-- Card 6 -->
  <g>
    <rect x="512" y="452" width="440" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="552" cy="464" r="12" fill="#c8e6c9"/>
    <text x="576" y="478" font-size="14.5" font-weight="bold" fill="#1f2430">Base Salada Mix de Folhas Verdes</text>
    <text x="940" y="478" text-anchor="end" font-size="14.5" font-weight="bold" fill="#1f2430">R$ 6.00</text>
    <text x="576" y="498" font-size="11" fill="#6b7280">🔥 45 kcal   •   🕐 3 min</text>
    <text x="540" y="534" font-size="11" fill="#4b5563">
      <tspan x="540" dy="0">Rúcula fresca, alface americana, alface roxa</tspan>
      <tspan x="540" dy="15">e folhas tenras da horta.</tspan>
    </text>
  </g>

  <!-- Painel direito: resumo em tempo real -->
  <rect x="1040" y="20" width="540" height="590" rx="14" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/>
  <text x="1072" y="66" font-size="13" font-weight="bold" letter-spacing="1" fill="#e2792a">RESUMO EM TEMPO REAL</text>
  <text x="1072" y="94" font-size="22" font-weight="bold" fill="#1f2430">Seu Lanche Atual</text>
  <text x="1072" y="116" font-size="12" fill="#6b7280">Preço recalculado a cada ingrediente</text>
  <line x1="1072" y1="132" x2="1558" y2="132" stroke="#eef0f2" stroke-width="1"/>

  <circle cx="1088" cy="164" r="10" fill="#f2d9b0"/>
  <text x="1112" y="169" font-size="13.5" font-weight="bold" fill="#1f2430">Pão Francês Tradicional</text>
  <text x="1558" y="169" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1f2430">R$ 4.50</text>

  <text x="1072" y="204" font-size="12" font-style="italic" fill="#9ca3af">Nenhum ingrediente adicional selecionado ainda.</text>
  <line x1="1072" y1="224" x2="1558" y2="224" stroke="#eef0f2" stroke-width="1"/>

  <text x="1072" y="252" font-size="12.5" fill="#374151">🔥 140 kcal</text>
  <text x="1200" y="252" font-size="12.5" fill="#374151">🕐 Preparo: ~4 min</text>

  <rect x="1072" y="278" width="486" height="86" rx="8" fill="#fdf1cf"/>
  <text x="1315" y="306" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#b45309">VALOR DESTE ITEM</text>
  <text x="1315" y="338" text-anchor="middle" font-size="26" font-weight="bold" fill="#92400e">R$ 4.50</text>

  <rect x="1072" y="382" width="486" height="52" rx="10" fill="#f0872b"/>
  <text x="1315" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">+  Adicionar ao Pedido</text>
</svg>
